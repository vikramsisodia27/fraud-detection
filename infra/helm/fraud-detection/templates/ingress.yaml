{{- if .Values.global.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fraud-detection-ingress
  namespace: {{ .Values.global.namespace }}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: {{ .Values.global.ingress.className }}
  rules:
    - host: {{ .Values.global.ingress.host }}
      http:
        paths:
          # fraud-agent-service (main orchestrator)
          - path: /(/|investigate|health)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ .Values.agent.name }}
                port:
                  number: {{ .Values.agent.port }}

          # fraud-ml-api (ML prediction service)
          - path: /ml-api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ .Values.mlApi.name }}
                port:
                  number: {{ .Values.mlApi.port }}

          # fraud-mcp-server
          - path: /mcp(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ .Values.mcpServer.name }}
                port:
                  number: {{ .Values.mcpServer.port }}

          # Qdrant Dashboard
          - path: /qdrant(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ .Values.qdrant.name }}
                port:
                  number: {{ .Values.qdrant.grpcPort }}
{{- end }}