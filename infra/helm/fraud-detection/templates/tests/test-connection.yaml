apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "fraud-detection.fullname" . }}-test-connection"
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "fraud-detection.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args:
        - '--timeout=5'
        - 'http://{{ .Values.agent.name }}:{{ .Values.agent.port }}/health'
  restartPolicy: Never