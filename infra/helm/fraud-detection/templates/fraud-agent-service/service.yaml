{{- if .Values.agent.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.agent.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.agent.name }}
    {{- include "fraud-detection.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ .Values.agent.name }}
  ports:
    - protocol: TCP
      port: {{ .Values.agent.port }}
      targetPort: {{ .Values.agent.port }}
  type: ClusterIP
{{- end }}