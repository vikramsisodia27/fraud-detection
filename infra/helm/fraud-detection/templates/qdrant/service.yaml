{{- if .Values.qdrant.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.qdrant.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.qdrant.name }}
    {{- include "fraud-detection.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ .Values.qdrant.name }}
  ports:
    - protocol: TCP
      name: grpc
      port: {{ .Values.qdrant.grpcPort }}
      targetPort: {{ .Values.qdrant.grpcPort }}
    - protocol: TCP
      name: http
      port: {{ .Values.qdrant.httpPort }}
      targetPort: {{ .Values.qdrant.httpPort }}
  type: ClusterIP
{{- end }}