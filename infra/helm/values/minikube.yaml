# =====================================================================
# Minikube (Local Development) Overrides
# =====================================================================
# Overrides for local development on Minikube.
# Use: helm install fraud-detection ./fraud-detection --values values/minikube.yaml
#     --set secrets.llmApiKey=... --set secrets.openaiApiKey=...
# =====================================================================

# ── fraud-detection Chart Overrides ─────────────────────────────────
fraud-detection:
  global:
    namespace: fraud-detection
    imageRegistry: "host.docker.internal:5000"
    imagePullPolicy: "Always"
    ingress:
      enabled: true
      host: "fraud-detection.local"
      className: "nginx"

  agent:
    replicas: 1

  mlApi:
    replicas: 1

  mcpServer:
    replicas: 1

  qdrant:
    replicas: 1
    storageSize: "5Gi"

  config:
    mlflowTrackingUri: "http://mlflow.mlflow-infra.svc.cluster.local:5000"

# ── mlflow-infra Chart Overrides ────────────────────────────────────
mlflow-infra:
  global:
    namespace: mlflow-infra

  mlflow:
    replicas: 1
    storageSize: "5Gi"