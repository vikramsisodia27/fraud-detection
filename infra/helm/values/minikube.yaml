# =====================================================================
# Minikube (Local Development) Overrides
# =====================================================================
# Overrides for local development on Minikube.
# Use: helm install fraud-detection ./fraud-detection --values values/minikube.yaml
#     --set secrets.llmApiKey=... --set secrets.openaiApiKey=...
# =====================================================================

# ── Global Settings ──────────────────────────────────────────────────
global:
  namespace: fraud-detection
  imageRegistry: "host.docker.internal:5001"
  imagePullPolicy: "Always"
  ingress:
    enabled: true
    host: "fraud-detection.local"
    className: "nginx"

# ── fraud-agent-service (Main Orchestrator) ──────────────────────────
agent:
  replicas: 1
  resources:
    limits:
      cpu: "1000m"
      memory: "2Gi"
    requests:
      cpu: "500m"
      memory: "1Gi"


# ── fraud-ml-api (ML Predictions) ────────────────────────────────────
mlApi:
  replicas: 1

# ── fraud-mcp-server (RAG Document Retrieval) ────────────────────────
mcpServer:
  replicas: 1

# ── qdrant (Vector Database) ─────────────────────────────────────────
qdrant:
  replicas: 1
  storageSize: "5Gi"

# ── ConfigMap Data ───────────────────────────────────────────────────
config:
  mlflowTrackingUri: "http://mlflow.mlflow-infra.svc.cluster.local:5000"
