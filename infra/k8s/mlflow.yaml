# =====================================================================
# RESOURCE 1: PersistentVolumeClaim (PVC)
# PURPOSE : Requests 5GB of persistent disk storage from the cluster.
#           This storage survives pod restarts and deletions.
# ANALOGY : Asking the hotel for a safety deposit box — you get a key
#           (the PVC) that gives you access to your storage.
# DOCKER EQ: `volumes: - ./mlflow:/mlflow` (bind mount in docker-compose)
# =====================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-pvc
  namespace: fraud-detection
spec:
  accessModes:
    - ReadWriteOnce          # Only one pod can read/write at a time
  resources:
    requests:
      storage: 5Gi           # Request 5 gigabytes of disk space

# =====================================================================
# RESOURCE 2: Deployment
# PURPOSE : Manages the MLflow server container. If the pod crashes,
#           the Deployment automatically restarts it.
# ANALOGY : A factory manager who says "I need 1 worker (replica)
#           wearing badge 'app: mlflow'. Here's the job description
#           (template) for new hires."
# =====================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: fraud-detection
spec:
  # --- SPEC #1: Deployment Spec (tells K8s HOW to manage pods) ---
  replicas: 1                # Keep exactly 1 pod running always
  selector:                  # How to find the pods this Deployment owns
    matchLabels:
      app: mlflow            # Must match the labels in template below

  # --- SPEC #2: Pod Template (blueprint for creating each pod) ---
  template:
    metadata:
      labels:
        app: mlflow           # Label applied to every pod (links to selector above)
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v2.19.0
          ports:
            - containerPort: 5000   # Port the container listens on
          command:
            - mlflow
            - server
            - --host
            - 0.0.0.0
            - --port
            - "5000"
            - --backend-store-uri
            - sqlite:///mlflow/mlflow.db
            - --default-artifact-root
            - /mlflow/artifacts

          # --- volumeMounts: Attaches storage INSIDE the container ---
          # Like Docker's `-v /local/path:/container/path`
          # This takes the volume declared below and mounts it at /mlflow
          # inside the container, so MLflow's database and artifacts
          # are saved to persistent disk (not lost on restart).
          volumeMounts:
            - name: mlflow-storage    # Must match a volume name below
              mountPath: /mlflow      # Path INSIDE container where data appears

      # --- volumes: Declares the storage sources available to this pod ---
      # Think of this as listing all "drives" connected to the pod.
      # Individual containers then choose which drives to mount.
      volumes:
        - name: mlflow-storage        # Local name used by volumeMounts above
          persistentVolumeClaim:
            claimName: mlflow-pvc     # Connects to the PVC declared at top

# =====================================================================
# RESOURCE 3: Service
# PURPOSE : Provides a stable DNS name `mlflow:5000` so other pods
#           can reach MLflow. Without this, pod IPs would change on
#           every restart.
# ANALOGY : A receptionist who forwards calls — you dial "mlflow:5000"
#           and the Service routes you to the correct pod.
# =====================================================================
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow               # This becomes the DNS name: "mlflow"
  namespace: fraud-detection
spec:
  selector:
    app: mlflow               # Routes traffic to pods with this label
  ports:
    - protocol: TCP
      port: 5000              # Port the Service listens on (other pods use this)
      targetPort: 5000         # Port the container is actually running on
  type: ClusterIP              # Only accessible within the cluster
                               # Access from your Mac via:
                               # kubectl port-forward svc/mlflow 5001:5000
                               # Then open http://localhost:5001
