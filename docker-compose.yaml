version: '3.9'

services:

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    ports:
      - "5001:5000"

  qdrant:
    image: qdrant/qdrant:v1.12.1
    ports:
      - "6333:6333"

  fraud-ml-api:
    build: ./fraud-ml-api
    ports:
      - "3000:3000"

  fraud-mcp-server:
    build: ./fraud-mcp-server
    ports:
      - "9000:9000"

  fraud-agent-service:
    build: ./fraud-agent-service
    ports:
      - "8000:8000"
