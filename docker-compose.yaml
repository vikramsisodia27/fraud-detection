version: '3.9'

services:

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    ports:
      - "5001:5000"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow.db
      --default-artifact-root /mlflow/artifacts
    volumes:
      - ./mlflow:/mlflow

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  fraud-ml-api:
    build:
      context: .
      dockerfile: fraud-ml-api/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ~/.bentoml:/root/bentoml
    depends_on:
      - mlflow
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000

  fraud-mcp-server:
    build:
      context: .
      dockerfile: fraud-mcp-server/Dockerfile
    ports:
      - "9000:9000"
    depends_on:
      - fraud-ml-api
      - qdrant
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333




  fraud-agent-service:
    build:
      context: .
      dockerfile: fraud-agent-service/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - fraud-mcp-server
      - qdrant
    environment:
      ML_API_URL: http://fraud-ml-api:3000
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333

volumes:
  qdrant_data: